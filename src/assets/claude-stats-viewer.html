<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Resumen Claude Code</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 20px auto; padding: 20px; }
    h1, h2, h3 { color: #2c3e50; }
    .summary { background: #ecf0f1; padding: 15px; margin: 20px 0; border-radius: 8px; }
    table { width: 100%; border-collapse: collapse; margin: 10px 0; }
    th, td { padding: 8px; border: 1px solid #ddd; text-align: left; }
    th { background-color: #3498db; color: white; }
    tr:nth-child(even) { background-color: #f2f2f2; }
  </style>
</head>
<body>
  <h1>Analizador de Estadísticas Claude Code</h1>
  <p>Sube tu archivo <code>stats-cache.json</code> para ver el resumen:</p>
  <input type="file" id="fileUpload" accept=".json" />
  <div id="summary" class="summary"></div>

  <script>
    document.getElementById('fileUpload').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        try {
          const data = JSON.parse(event.target.result);
          const summarySection = document.getElementById('summary');
          summarySection.innerHTML = '';

          // Extraer datos clave
          const totalMessages = data.totalMessages || 0;
          const totalSessions = data.totalSessions || 0;
          const sonnetData = data.modelUsage?.['claude-sonnet-4-6'] || {};
          const haikuData = data.modelUsage?.['claude-haiku-4-5-20251001'] || {};

          // Resumen rápido
          const quickSummary = `
            <h2>Resumen General</h2>
            <table>
              <tr><th>Total mensajes</th><td>${totalMessages.toLocaleString()}</td></tr>
              <tr><th>Total sesiones</th><td>${totalSessions.toLocaleString()}</td></tr>
              <tr><th>Tokens Sonnet 4-6 (output)</th><td>${(sonnetData.outputTokens || 0).toLocaleString()}</td></tr>
              <tr><th>Tokens Haiku 4-5 (output)</th><td>${(haikuData.outputTokens || 0).toLocaleString()}</td></tr>
              <tr><th>Cache read Sonnet</th><td>${(sonnetData.cacheReadInputTokens || 0).toLocaleString()}</td></tr>
              <tr><th>Cache read Haiku</th><td>${(haikuData.cacheReadInputTokens || 0).toLocaleString()}</td></tr>
            </table>

            <h3>Actividad Diaria</h3>
            <table>
              <tr><th>Fecha</th><th>Mensajes</th><th>Sesiones</th><th>Tool Calls</th></tr>
              ${(data.dailyActivity || []).map(day => `
                <tr>
                  <td>${day.date}</td>
                  <td>${day.messageCount.toLocaleString()}</td>
                  <td>${day.sessionCount.toLocaleString()}</td>
                  <td>${day.toolCallCount.toLocaleString()}</td>
                </tr>
              `).join('')}
            </table>

            <h3>Tokens por Modelo (Diario)</h3>
            <table>
              <tr><th>Fecha</th><th>Sonnet 4-6</th><th>Haiku 4-5</th></tr>
              ${(data.dailyModelTokens || []).map(day => {
                const sonnet = day.tokensByModel?.['claude-sonnet-4-6'] || 0;
                const haiku = day.tokensByModel?.['claude-haiku-4-5-20251001'] || 0;
                return `
                  <tr>
                    <td>${day.date}</td>
                    <td>${sonnet.toLocaleString()}</td>
                    <td>${haiku.toLocaleString()}</td>
                  </tr>
                `;
              }).join('')}
            </table>
          `;

          summarySection.innerHTML = quickSummary;
        } catch (error) {
          document.getElementById('summary').innerHTML = '<div style="color:red;">Error: Archivo JSON inválido o corrupto</div>';
          console.error(error);
        }
      };
      reader.readAsText(file);
    });
  </script>
</body>
</html>
